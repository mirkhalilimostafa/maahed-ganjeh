services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ganjeh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ganjeh_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ganjeh}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ganjeh}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ganjeh}:${POSTGRES_PASSWORD:-ganjeh_secret}@db:5432/${POSTGRES_DB:-ganjeh}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api/app:/app/app
      - uploads:/app/uploads

  web:
    build: ./web
    depends_on:
      - api

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web

volumes:
  pgdata:
  uploads:
