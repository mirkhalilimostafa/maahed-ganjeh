name: build-and-push
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login Hamdocker
        id: login-hamdocker
        uses: docker/login-action@v3
        with:
          registry: registry.hamdocker.ir
          username: ${{ secrets.HAMDOCKER_USERNAME }}
          password: ${{ secrets.HAMDOCKER_PASSWORD }}
        continue-on-error: true
      - name: Login Hamdocker (retry)
        if: steps.login-hamdocker.outcome == 'failure'
        uses: docker/login-action@v3
        with:
          registry: registry.hamdocker.ir
          username: ${{ secrets.HAMDOCKER_USERNAME }}
          password: ${{ secrets.HAMDOCKER_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/mirkhalilimostafa/maahed-ganjeh:latest
            registry.hamdocker.ir/maahedir/maahed-ganjeh-tehran:latest
          provenance: false
