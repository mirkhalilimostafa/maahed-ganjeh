name: build-and-push
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Retry Hamdocker push without spamming on every flake
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GHCR
        id: push-ghcr
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/mirkhalilimostafa/maahed-ganjeh:latest
            ghcr.io/mirkhalilimostafa/maahed-ganjeh:${{ github.sha }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Hamdocker is flaky from GitHub Actions (EOF). Never fail the whole
      # workflow on it — otherwise every flake emails the owner.
      - name: Login Hamdocker
        id: login-hamdocker
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: registry.hamdocker.ir
          username: ${{ secrets.HAMDOCKER_USERNAME }}
          password: ${{ secrets.HAMDOCKER_PASSWORD }}

      - name: Login Hamdocker (retry)
        id: login-hamdocker-retry
        if: steps.login-hamdocker.outcome == 'failure'
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: registry.hamdocker.ir
          username: ${{ secrets.HAMDOCKER_USERNAME }}
          password: ${{ secrets.HAMDOCKER_PASSWORD }}

      - name: Push Hamdocker (best-effort)
        id: push-hamdocker
        if: steps.login-hamdocker.outcome == 'success' || steps.login-hamdocker-retry.outcome == 'success'
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            registry.hamdocker.ir/maahedir/maahed-ganjeh-tehran:latest
            registry.hamdocker.ir/maahedir/maahed-ganjeh-tehran:${{ github.sha }}
          provenance: false
          cache-from: type=gha

      - name: Summarize registries
        run: |
          echo "GHCR: success (required)"
          if [ "${{ steps.push-hamdocker.outcome }}" = "success" ]; then
            echo "Hamdocker: success"
          else
            echo "Hamdocker: skipped/failed (best-effort; does not fail job)"
            echo "::warning::Hamdocker push did not succeed — Darkube image may be stale until next successful push."
          fi
